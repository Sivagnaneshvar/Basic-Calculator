<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator - Premium Glassmorphism</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme">
  <!-- Ambient Scenic Gradient Background Elements -->
  <div class="scenic-background" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="scenic-horizon"></div>
    <div class="scenic-grid-glow"></div>
  </div>

  <main class="calculator-wrapper">
    <div class="calculator-card" role="region" aria-label="Basic Calculator">
      <!-- Calculator Header -->
      <header class="calculator-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
              <line x1="8" y1="6" x2="16" y2="6"></line>
              <line x1="16" y1="14" x2="16" y2="18"></line>
              <path d="M8 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M16 10h.01"></path>
              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
            </svg>
          </div>
          <h1 class="brand-title">Basic Calculator</h1>
        </div>

        <!-- Light / Dark Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark theme" title="Toggle theme">
          <div class="toggle-track">
            <div class="toggle-thumb">
              <!-- Sun Icon -->
              <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <!-- Moon Icon -->
              <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
          </div>
        </button>
      </header>

      <!-- Display Screen Area -->
      <section class="display-container" aria-live="polite">
        <div class="expression-line" id="expression-display" title="Calculation Expression"></div>
        <div class="result-line" id="result-display" title="Result">0</div>
      </section>

      <!-- Calculator Keypad Grid -->
      <div class="keypad-grid" role="group" aria-label="Calculator keypad">
        <!-- Row 1: AC, Backspace, %, ÷ -->
        <button type="button" class="calc-btn btn-ac" data-action="clear" aria-label="All Clear">AC</button>
        <button type="button" class="calc-btn btn-neutral" data-action="backspace" aria-label="Backspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button type="button" class="calc-btn btn-neutral" data-action="percent" aria-label="Percentage">%</button>
        <button type="button" class="calc-btn btn-operator" data-action="divide" aria-label="Divide">÷</button>

        <!-- Row 2: 7, 8, 9, × -->
        <button type="button" class="calc-btn btn-number" data-value="7">7</button>
        <button type="button" class="calc-btn btn-number" data-value="8">8</button>
        <button type="button" class="calc-btn btn-number" data-value="9">9</button>
        <button type="button" class="calc-btn btn-operator" data-action="multiply" aria-label="Multiply">×</button>

        <!-- Row 3: 4, 5, 6, − -->
        <button type="button" class="calc-btn btn-number" data-value="4">4</button>
        <button type="button" class="calc-btn btn-number" data-value="5">5</button>
        <button type="button" class="calc-btn btn-number" data-value="6">6</button>
        <button type="button" class="calc-btn btn-operator" data-action="subtract" aria-label="Subtract">−</button>

        <!-- Row 4: 1, 2, 3, + -->
        <button type="button" class="calc-btn btn-number" data-value="1">1</button>
        <button type="button" class="calc-btn btn-number" data-value="2">2</button>
        <button type="button" class="calc-btn btn-number" data-value="3">3</button>
        <button type="button" class="calc-btn btn-operator" data-action="add" aria-label="Add">+</button>

        <!-- Row 5: 0 (span 2), Decimal, = -->
        <button type="button" class="calc-btn btn-number btn-zero" data-value="0">0</button>
        <button type="button" class="calc-btn btn-number" data-value="." aria-label="Decimal point">.</button>
        <button type="button" class="calc-btn btn-equals" data-action="calculate" aria-label="Equals">=</button>
      </div>
    </div>
  </main>

  <!-- JavaScript -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
